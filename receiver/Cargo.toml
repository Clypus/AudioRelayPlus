[package]
name = "audiorelayplus-receiver"
version = "0.4.0"
edition = "2021"
description = "AudioRelayPlus PC receiver: plays a phone's microphone stream from the network on a sound device"
license = "MIT"
repository = "https://github.com/Clypus/AudioRelayPlus"

[lib]
name = "arp"
path = "src/lib.rs"

[[bin]]
name = "arp-receiver"
path = "src/bin/receiver.rs"

[[bin]]
name = "arp-tools"
path = "src/bin/tools.rs"

[[bin]]
name = "arp-gui"
path = "src/bin/gui.rs"

[dependencies]
aec-rs-sys = "1.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
eframe = { version = "0.29", features = ["persistence"] }
hound = "3.5"
nnnoiseless = "0.5"
opus = "0.3"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", features = ["mp3"] }
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
